# Local demo: PostgreSQL + API. Secrets come from .env (git-ignored); nothing is hard-coded here.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sahil
      POSTGRES_DB: sahil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup-and-run.ps1 or create .env from .env.example}
    volumes:
      - sahil-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahil -d sahil"]
      interval: 3s
      timeout: 3s
      retries: 20
    # The database is not published to the host: only the API can reach it.

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://sahil:${POSTGRES_PASSWORD}@db:5432/sahil
      JWT_SECRET: ${JWT_SECRET:?Run setup-and-run.ps1 or create .env from .env.example}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SEED_DEMO_DATA: "true"
    ports:
      - "127.0.0.1:8000:8000"   # reachable from this computer only
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  sahil-db:
